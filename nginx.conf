server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Imágenes de quintas/visitas (el backend acepta hasta 20MB por request)
    client_max_body_size 25m;

    # API: se reenvía al contenedor del backend (servicio "backend" del docker-compose).
    # Debe ir antes del bloque de assets para que /tesina/*.png etc. lleguen al backend.
    location ^~ /tesina/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cache largo para assets con hash
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA: cualquier ruta desconocida sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
